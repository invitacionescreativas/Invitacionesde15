<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Mercedes & Nicolás ¡¡¡Nos Casamos!!!</title>

    <!-- Miniatura para compartir -->
    <meta property="og:title" content="Mercedes & Nicolás ¡¡¡Nos Casamos!!!">
    <meta property="og:description" content="¡Nos Casamos!">
    <meta property="og:image" content="miniatura.png">
    <meta property="og:type" content="website">

    <meta name="theme-color" content="#000000">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /* CONTENEDOR PRINCIPAL */
        .portada {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000;
        }

        /* MINIATURA */
        .miniatura {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* VIDEO */
        .video-portada {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            background: #000;
        }

        /*
        CAPA OSCURA MUY SUAVE
        Ayuda a que el botón se vea bien
        */
        .overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.05) 0%,
                    rgba(0,0,0,0.00) 45%,
                    rgba(0,0,0,0.18) 100%
                );
        }

        /* BOTÓN */
        .boton-container {
            position: absolute;

            /*
            Un poco por debajo de la mitad
            */
            top: 64%;

            left: 50%;
            transform: translateX(-50%);

            z-index: 10;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }

        .boton-container.mostrar {
            opacity: 1;
            visibility: visible;
        }

        .boton-invitacion {
            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 220px;
            min-height: 52px;

            padding: 15px 28px;

            background: #cf9458;
            color: #ffffff;

            border: none;
            border-radius: 3px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            letter-spacing: 1.5px;

            cursor: pointer;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.28);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .boton-invitacion:hover {
            background: #b98048;

            transform: translateY(-2px);

            box-shadow:
                0 8px 24px rgba(0,0,0,0.35);
        }

        .boton-invitacion:active {
            transform: translateY(0);
        }

        /* ANIMACIÓN SUAVE DEL BOTÓN */
        .boton-container.mostrar .boton-invitacion {
            animation: aparecerBoton 0.8s ease forwards;
        }

        @keyframes aparecerBoton {

            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* TABLET */
        @media (min-width: 600px) {

            .boton-container {
                top: 65%;
            }

            .boton-invitacion {
                min-width: 240px;
                min-height: 56px;

                font-size: 15px;
            }

        }

        /* COMPUTADORA */
        @media (min-width: 1000px) {

            .boton-container {
                top: 66%;
            }

            .boton-invitacion {
                min-width: 250px;
                min-height: 58px;

                font-size: 15px;
            }

        }

    </style>
</head>

<body>

    <main class="portada">

        <!-- MINIATURA -->
        <img
            class="miniatura"
            src="miniatura.png"
            alt="Mercedes & Nicolás"
        >

        <!-- VIDEO -->
        <video
            id="videoPortada"
            class="video-portada"
            autoplay
            muted
            playsinline
            preload="auto"
            poster="miniatura.png"
        >
            <source src="video.mp4" type="video/mp4">

            Tu navegador no puede reproducir este video.
        </video>

        <!-- OVERLAY -->
        <div class="overlay"></div>

        <!-- BOTÓN -->
        <div
            id="botonContainer"
            class="boton-container"
        >

            <!--
            REEMPLAZAR ESTA URL
            por la página de la invitación.
            -->
            <a
                id="botonInvitacion"
                class="boton-invitacion"
                href="https://teinvito.invitacionescreativas.com.ar/mercedes-nicolas-nos-casamos"
            >
                ABRIR INVITACIÓN
            </a>

        </div>

    </main>


    <script>

        const video = document.getElementById("videoPortada");
        const botonContainer = document.getElementById("botonContainer");

        /*
        Mostrar el botón después de 3 segundos
        */
        setTimeout(function() {

            botonContainer.classList.add("mostrar");

        }, 3000);


        /*
        Intentar reproducir automáticamente
        */
        window.addEventListener("load", function() {

            video.play().catch(function() {

                /*
                Algunos navegadores pueden bloquear
                el autoplay. Como el video está muted,
                normalmente funcionará.
                */

            });

        });

    </script>

</body>
</html>
