<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis 15 Años</title>

<!-- FUENTES ELEGANTES -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#f8e1ff;
  --bg2:#e0c3fc;
  --text:#4b3b4f;
  --accent:#b76cff;
  --btn-text:#ffffff;
}

body{
  margin:0;
  font-family:'Montserrat', sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);
  text-align:center;
  overflow-x:hidden;
}

h1{
  font-family:'Playfair Display', serif;
  font-size:3em;
  margin-top:40px;
}

h2{
  font-weight:300;
  letter-spacing:3px;
}

.section{
  padding:60px 20px;
}

.card{
  background:#ffffffcc;
  backdrop-filter:blur(10px);
  margin:20px auto;
  padding:30px;
  border-radius:20px;
  max-width:600px;
  box-shadow:0 10px 30px #00000015;
}

button{
  background:var(--accent);
  color:var(--btn-text);
  border:none;
  padding:12px 22px;
  border-radius:30px;
  font-size:15px;
  cursor:pointer;
  margin-top:10px;
}

input, select, textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ddd;
  font-family:inherit;
}

/* GALERÍA */
.gallery img{
  width:100%;
  border-radius:15px;
  margin-bottom:10px;
}

/* CONTADOR EN UNA LÍNEA */
.countdown{
  font-size:1.5em;
  letter-spacing:2px;
}

/* BOTÓN FLOTANTE MÚSICA */
.music-btn{
  position:fixed;
  top:15px;
  right:15px;
  font-size:22px;
  background:var(--accent);
  color:white;
  width:45px;
  height:45px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

/* SELECTOR DE COLORES */
.theme-picker{
  position:fixed;
  bottom:15px;
  right:15px;
  background:white;
  padding:10px;
  border-radius:15px;
  box-shadow:0 5px 20px #00000020;
}
.color-option{
  width:22px;
  height:22px;
  border-radius:50%;
  display:inline-block;
  cursor:pointer;
  margin:4px;
}
</style>
</head>

<body>

<!-- MÚSICA -->
<audio id="music" src="musica.mp3" loop></audio>
<div class="music-btn" onclick="toggleMusic()">🎵</div>

<!-- SELECTOR DE COLORES -->
<div class="theme-picker">
  <div class="color-option" style="background:linear-gradient(45deg,#f8e1ff,#e0c3fc)" onclick="setTheme('#f8e1ff','#e0c3fc','#b76cff')"></div>
  <div class="color-option" style="background:linear-gradient(45deg,#ffd1dc,#ff9a9e)" onclick="setTheme('#ffd1dc','#ff9a9e','#ff4f81')"></div>
  <div class="color-option" style="background:linear-gradient(45deg,#c2e9fb,#a1c4fd)" onclick="setTheme('#c2e9fb','#a1c4fd','#4a90e2')"></div>
  <div class="color-option" style="background:linear-gradient(45deg,#232526,#414345)" onclick="setTheme('#232526','#414345','#ffffff')"></div>
</div>

<!-- ENCABEZADO -->
<section class="section">
  <h1><!-- NOMBRE QUINCEAÑERA --> Valentina</h1>
  <h2>Mis 15 Años</h2>
</section>

<!-- CONTADOR -->
<section class="section">
  <div class="countdown" id="countdown"></div>
</section>

<!-- GALERÍA -->
<section class="section card gallery">
  <h2>Galería</h2>
  <!-- CAMBIAR FOTOS AQUÍ (HASTA 5) -->
  <img src="foto1.jpg">
  <img src="foto2.jpg">
  <img src="foto3.jpg">
</section>

<!-- EVENTO -->
<section class="section card">
  <h2>Detalles del Evento</h2>
  <p>📅 <!-- FECHA --> 15 Junio 2026</p>
  <p>⏰ <!-- HORA --> 21:00 hs</p>
  <p>📍 <!-- LUGAR --> Salón Dorado</p>
  <button onclick="openMap()">Ver ubicación</button>
</section>

<!-- REGALO -->
<section class="section card">
  <h2>Regalo</h2>
  <button onclick="toggleGift()">Ver datos para regalo</button>
  <div id="gift" style="display:none">
    <p>CBU: 000000000000000000</p>
    <p>Alias: valen.15</p>
  </div>
</section>

<!-- CONFIRMACIÓN -->
<section class="section card">
  <h2>Confirmar Asistencia</h2>
  <form onsubmit="sendWhatsApp(event,'confirm')">
    <input type="text" id="name" placeholder="Tu nombre" required>
    <select id="attend">
      <option>Sí asisto</option>
      <option>No puedo asistir</option>
    </select>
    <button>Enviar</button>
  </form>
</section>

<!-- RESTRICCIÓN ALIMENTARIA -->
<section class="section card">
  <h2>Restricción Alimentaria</h2>
  <form onsubmit="sendWhatsApp(event,'diet')">
    <input type="text" id="dietName" placeholder="Tu nombre">
    <input type="text" id="dietText" placeholder="Describe tu restricción">
    <button>Enviar</button>
  </form>
</section>

<!-- CANCIÓN -->
<section class="section card">
  <h2>Sugerir Canción</h2>
  <form onsubmit="sendWhatsApp(event,'song')">
    <input type="text" id="songName" placeholder="Tu nombre">
    <input type="text" id="songText" placeholder="Nombre de la canción">
    <button>Enviar</button>
  </form>
</section>

<script>
// 🎵 MÚSICA
function toggleMusic(){
  const music=document.getElementById("music");
  music.paused?music.play():music.pause();
}

// 🎨 CAMBIO DE COLORES AUTOMÁTICO
function setTheme(bg1,bg2,accent){
  document.documentElement.style.setProperty('--bg1',bg1);
  document.documentElement.style.setProperty('--bg2',bg2);
  document.documentElement.style.setProperty('--accent',accent);

  // Detectar si es oscuro
  const dark = tinycolor(bg1).isDark();
  document.documentElement.style.setProperty('--text', dark ? "#ffffff" : "#4b3b4f");
  document.documentElement.style.setProperty('--btn-text', dark ? "#000000" : "#ffffff");
}

// ⏳ CUENTA REGRESIVA (EDITAR FECHA)
const eventDate=new Date("Jun 15, 2026 21:00:00").getTime();
setInterval(()=>{
  const now=new Date().getTime();
  const d=eventDate-now;
  if(d<0)return;
  const days=Math.floor(d/(1000*60*60*24));
  const hours=Math.floor((d%(1000*60*60*24))/(1000*60*60));
  const mins=Math.floor((d%(1000*60*60))/(1000*60));
  const secs=Math.floor((d%(1000*60))/1000);
  document.getElementById("countdown").innerHTML=`${days}d ${hours}h ${mins}m ${secs}s`;
},1000);

// 🎁 REGALO
function toggleGift(){
  const g=document.getElementById("gift");
  g.style.display=g.style.display==="none"?"block":"none";
}

// 📍 MAPA (PEGAR LINK GOOGLE MAPS)
function openMap(){
  window.open("https://maps.google.com","_blank");
}

// 💬 ENVÍO A WHATSAPP
function sendWhatsApp(e,type){
  e.preventDefault();
  const phone="549XXXXXXXXXX"; // TU NÚMERO

  let msg="";
  if(type==="confirm"){
    msg=`Confirmación 15 años\nNombre: ${name.value}\nAsistencia: ${attend.value}`;
  }
  if(type==="diet"){
    msg=`Restricción alimentaria\nNombre: ${dietName.value}\nDetalle: ${dietText.value}`;
  }
  if(type==="song"){
    msg=`Sugerencia de canción\nNombre: ${songName.value}\nCanción: ${songText.value}`;
  }

  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank');
}
</script>

<!-- LIBRERÍA PARA DETECTAR COLOR OSCURO -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tinycolor/1.4.2/tinycolor.min.js"></script>

</body>
</html>
