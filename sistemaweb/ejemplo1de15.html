<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitación 15 Años</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --bg: linear-gradient(135deg,#f8cdda,#fbc2eb);
  --text:#333;
  --accent:#ffffffcc;
  --btn-bg:#ffffffaa;
  --btn-text:#333;
}

body{
  margin:0;
  font-family:'Montserrat',sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.5s ease;
  text-align:center;
}

section{padding:70px 20px;}

h1{
  font-family:'Playfair Display',serif;
  font-size:3em;
  margin:0;
}

h2{font-weight:300; letter-spacing:2px;}

button{
  padding:10px 20px;
  border-radius:30px;
  border:none;
  cursor:pointer;
  background:var(--btn-bg);
  color:var(--btn-text);
  margin-top:15px;
}

/* 🎨 BOTÓN ABRIR PALETA */
#openPalette{
  position:fixed;
  top:15px;
  right:15px;
  z-index:1000;
}

/* 🎨 MODAL PALETA */
.palette-modal{
  display:none;
  position:fixed;
  inset:0;
  background:#00000055;
  justify-content:center;
  align-items:center;
}

.palette-box{
  background:white;
  padding:25px;
  border-radius:20px;
  max-width:420px;
}

.colors{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  margin-bottom:15px;
}

.color{
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
}

/* 🎞 CARRUSEL */
.carousel{
  max-width:500px;
  margin:auto;
  position:relative;
}
.carousel img{
  width:100%;
  border-radius:15px;
  display:none;
}
.carousel img.active{display:block}

/* ⏳ CUENTA REGRESIVA UNA LÍNEA */
.countdown{
  font-size:1.4em;
  white-space:nowrap;
}

/* RESPONSIVE */
@media(max-width:600px){
  h1{font-size:2.2em;}
}
</style>
</head>
<body>

<!-- 🎨 BOTÓN PALETA -->
<button id="openPalette">🎨 Colores</button>

<div class="palette-modal" id="palette">
  <div class="palette-box">
    <div class="colors">
      <div class="color" style="background:#f8cdda" onclick="setTheme('#f8cdda','#333')"></div>
      <div class="color" style="background:#d4fc79" onclick="setTheme('#d4fc79','#333')"></div>
      <div class="color" style="background:#a1c4fd" onclick="setTheme('#a1c4fd','#333')"></div>
      <div class="color" style="background:#fbc2eb" onclick="setTheme('#fbc2eb','#333')"></div>
      <div class="color" style="background:#232526" onclick="setTheme('#232526','#fff')"></div>
      <div class="color" style="background:#ff9a9e" onclick="setTheme('#ff9a9e','#333')"></div>
      <div class="color" style="background:#c471f5" onclick="setTheme('#c471f5','#fff')"></div>
      <div class="color" style="background:#43cea2" onclick="setTheme('#43cea2','#fff')"></div>
      <div class="color" style="background:#fa709a" onclick="setTheme('#fa709a','#333')"></div>
      <div class="color" style="background:#30cfd0" onclick="setTheme('#30cfd0','#333')"></div>
      <div class="color" style="background:#f7971e" onclick="setTheme('#f7971e','#333')"></div>
      <div class="color" style="background:#654ea3" onclick="setTheme('#654ea3','#fff')"></div>
    </div>
    <button onclick="closePalette()">Cerrar</button>
  </div>
</div>

<!-- 🎵 MÚSICA DE FONDO -->
<!-- CAMBIAR AQUÍ LA CANCIÓN -->
<audio autoplay loop controls>
  <source src="cancion.mp3" type="audio/mpeg">
</audio>

<!-- 💖 BIENVENIDA -->
<section>
  <h2>Bienvenidos</h2>
  <div class="carousel">
    <!-- FOTO 1 -->
    <img src="foto1.jpg" class="active">
    <!-- FOTO 2 -->
    <img src="foto2.jpg">
    <!-- FOTO 3 -->
    <img src="foto3.jpg">
  </div>
</section>

<!-- 👑 INICIO -->
<section>
  <h1><!-- NOMBRE --> Martina</h1>
  <h2>✨ Mis 15 Años ✨</h2>
</section>

<!-- 💌 INVITACIÓN -->
<section>
  <h2>Estás invitado</h2>
  <p>12 Diciembre 2026 — 21:00 hs</p>
  <div class="countdown" id="countdown"></div>
</section>

<script>
// 🎨 PALETA
document.getElementById("openPalette").onclick=()=>palette.style.display="flex";
function closePalette(){palette.style.display="none";}
function setTheme(color,text){
  document.documentElement.style.setProperty('--bg',color);
  document.documentElement.style.setProperty('--text',text);
  document.documentElement.style.setProperty('--btn-text',text);
}

// 🎞 CARRUSEL AUTO
let slides=document.querySelectorAll(".carousel img");
let i=0;
setInterval(()=>{
  slides[i].classList.remove("active");
  i=(i+1)%slides.length;
  slides[i].classList.add("active");
},3000);

// ⏳ CUENTA REGRESIVA
const eventDate=new Date("Dec 12, 2026 21:00:00").getTime();
setInterval(()=>{
  let now=new Date().getTime();
  let d=Math.floor((eventDate-now)/(1000*60*60*24));
  let h=Math.floor((eventDate-now)/(1000*60*60)%24);
  let m=Math.floor((eventDate-now)/(1000*60)%60);
  let s=Math.floor((eventDate-now)/1000%60);
  countdown.innerHTML=`Faltan ${d}d ${h}h ${m}m ${s}s`;
},1000);
</script>

</body>
</html>
