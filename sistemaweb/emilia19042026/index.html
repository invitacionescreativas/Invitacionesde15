  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    
    .invitation-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    .video-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    
    .content-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 12%;
    }
    
    .open-button {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffffff;
      background-color: #61929a;
      border: none;
      padding: 16px 40px;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(97, 146, 154, 0.35);
      position: relative;
      overflow: hidden;
    }
    
    .open-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.2),
        transparent
      );
      transition: left 0.6s ease;
    }
    
    .open-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(97, 146, 154, 0.45);
      background-color: #5a8a91;
    }
    
    .open-button:hover::before {
      left: 100%;
    }
    
    .open-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 15px rgba(97, 146, 154, 0.3);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .animate-fade-in-up {
      animation: fadeInUp 1s ease-out 0.5s both;
    }
  </style>

  <script>
    const defaultConfig = {
      button_text: 'Abrir invitación',
      button_link: 'https://teinvito.invitacionescreativas.com.ar/emilia-15-a-os',
      button_color: '#61929a',
      font_family: 'Cormorant Garamond',
      font_size: 16
    };

    async function onConfigChange(config) {
      const button = document.getElementById('invitation-button');
      
      if (button) {
        button.textContent = config.button_text || defaultConfig.button_text;
        button.href = config.button_link || defaultConfig.button_link;
        button.style.backgroundColor = config.button_color || defaultConfig.button_color;
        
        const fontFamily = config.font_family || defaultConfig.font_family;
        button.style.fontFamily = `'${fontFamily}', serif`;
        
        const fontSize = config.font_size || defaultConfig.font_size;
        button.style.fontSize = `${fontSize * 1.1}px`;
      }
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.button_color || defaultConfig.button_color,
            set: (value) => {
              config.button_color = value;
              window.elementSdk.setConfig({ button_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => {
            config.font_family = value;
            window.elementSdk.setConfig({ font_family: value });
          }
        },
        fontSizeable: {
          get: () => config.font_size || defaultConfig.font_size,
          set: (value) => {
            config.font_size = value;
            window.elementSdk.setConfig({ font_size: value });
          }
        }
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ['button_text', config.button_text || defaultConfig.button_text],
        ['button_link', config.button_link || defaultConfig.button_link]
      ]);
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>
