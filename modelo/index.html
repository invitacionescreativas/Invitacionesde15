<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitaciones Creativas</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #f8ead8, #fcf6f0, #e2c39d);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 40px;
      border-radius: 20px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      margin-bottom: 10px;
      color: #6d4c41;
    }

    p {
      font-size: 14px;
      color: #555;
      margin-bottom: 25px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
      margin-bottom: 20px;
    }

    button {
      background: #c89b6d;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 30px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }

    button:hover {
      background: #b5835a;
      transform: scale(1.03);
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Invitaciones Creativas</h1>
    <p>Diseños digitales únicos para tus momentos más especiales</p>

    <select id="evento">
      <option value="">Elegí tu tipo de evento</option>
      <option value="Boda">Boda</option>
      <option value="15 años">15 años</option>
      <option value="18 años">18 años</option>
      <option value="Otro evento">Otro evento</option>
    </select>

    <button onclick="enviarWhatsApp()">Quiero más información</button>

    <div class="footer">
      Atención personalizada por WhatsApp 💬
    </div>
  </div>

  <script>
    function enviarWhatsApp() {
      const evento = document.getElementById("evento").value;

      if (evento === "") {
        alert("Por favor elegí un tipo de evento 💖");
        return;
      }

      const numero = "5493413904417"; // TU WHATSAPP
      const mensaje = `Hola! Quiero más información sobre invitaciones para ${evento} 🎉`;
      const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;

      window.open(url, '_blank');
    }
  </script>

</body>
</html>
